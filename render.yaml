# ============================================================
# Loop Closer — Render Blueprint (render.yaml)
# ============================================================
# Deploy with: connect this repo to Render → "New Blueprint"
#
# Free Tier Bypass: This uses a single 'web' service to run
# the webhook, listener, and cron engine simultaneously via start.sh
# ============================================================

services:
  - type: web
    name: loop-closer-app
    runtime: python
    region: oregon            # Matches your DB region or closest available
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /webhook  # Render pings this to confirm the service is up
    envVars:
      # Database
      - key: DATABASE_URL
        sync: false
      
      # Webhook Security
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      
      # Communication SDKs
      - key: CASPIAN_API_KEY
        sync: false
      - key: SLACK_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        
      # AI Model
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      
      # System
      - key: PYTHON_VERSION
        value: "3.11"
